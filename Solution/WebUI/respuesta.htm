<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <script src="scripts/jquery.js" type="text/javascript"></script>
    <script src="scripts/jquery-ui.js" type="text/javascript"></script> 
    <script src="scripts/functions.js" type="text/javascript"></script>   
    <script src="scripts/server.js" type="text/javascript"></script>
     <script type="text/javascript">
         $(document).ready(function () {
             var clave = GetQueryStringParams("clave");
             var tipo = GetQueryStringParams("tipo");

             GetRespuesta(clave, tipo);
         });

         function GetRespuesta(clave,tipo) {

             var jsonText = JSON.stringify({ clave: clave });
             if (tipo=="res")
                 CallServerMethods(webservice + "GetRespuesta", jsonText, 0);
             if (tipo == "xml")
                 CallServerMethods(webservice + "GetXML", jsonText, 0);

         }

         
         function ServerResult(data, retorno) {
             if (data != "") {
                 if (retorno == 0) {
                     $("#respuesta").html(data.d);
                 }                 
             }
         }

    </script>
</head>
<body>
    <div id="respuesta">
    </div>
</body>
</html>
