<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <script src="scripts/jquery.js" type="text/javascript"></script>
    <script src="scripts/jquery-ui.js" type="text/javascript"></script>    
    <script src="scripts/server.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            $("#btnsave").on("click", Save);

        });

        function Save() {

            var obj = {};
            obj["emp_codigo"] = $("#txtcodigo").val();
            obj["emp_ruc"] = $("#txtruc").val();
            obj["emp_nombre"] = $("#txtnombre").val();
            var jsonText = JSON.stringify({ objeto: obj });
            CallServerMethods(webservice + "SaveEmpresa", jsonText, 0);

        }

        function ServerResult(data, retorno) {
            if (data != "") {
                if (retorno == 0) {
                    alert(data.d);
                }
            }
        }

    </script>
</head>
<body>
    <input id="txtcodigo" type="text" />
    <input id="txtruc" type="text" />
    <input id="txtnombre" type="text" />
    <input id="btnsave" type="button" value="Save" />
</body>
</html>
