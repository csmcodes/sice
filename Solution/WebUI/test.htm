     <script type="text/javascript">
         $(document).ready(function () {
             $("#crea").on("click", Crea);

             $("#verify").on("click", VerifyXML);

             $("#setclave").on("click", SetClave);
             $("#verifyall").on("click", VerifyAll);
             $("#recalcula").on("click", Recalcular);
             $("#clientes").on("click", GetCli);
             $("#runservice").on("click", RunSrv);

             $("#sendprueba").on("click", SendPrueba);
             $("#impmasivo").on("click", ImpMasivo);
         });

         function GetCli() {

             //var jsonText = JSON.stringify({ xml: $("#txtxml").val()});
             //CallServerMethods(webservice + "UploadComprobante", jsonText, 0);

             var obj = {};            
             var jsonText = JSON.stringify({ objeto: obj });
             //CallServerMethods(webservice + "UploadComprobante", jsonText, 0);
             CallServerMethods(webservice + "GetAllCli", jsonText, 0);

         }

         function SendXML() {

             var obj = {};
             obj["clave"] = $("#txtclave").val();
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "SendXML", jsonText, 0);

         }

         function SetClave() {

             var obj = {};
             obj["clave"] = $("#txtclave").val();
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "SetClave", jsonText, 1);

         }

         function Crea() {

             var obj = {};
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "CreaUsuarios", jsonText, 0);

         }


         function UploadXML() {

             //var jsonText = JSON.stringify({ xml: $("#txtxml").val()});
             //CallServerMethods(webservice + "UploadComprobante", jsonText, 0);

             var obj = {};
             obj["mail"] = "info@cumpleanos.com.ec";
             obj["xml"] = $("#txtxml").val();
             obj["tipo"] = 1;
             var jsonText = JSON.stringify({ objeto: obj });
             //CallServerMethods(webservice + "UploadComprobante", jsonText, 0);
             CallServerMethods(webservice + "RecibirComprobanteObj", jsonText, 0);

         }

         function VerifyXML() {
             var jsonText = JSON.stringify({ clave: $("#txtclave").val() });
             CallServerMethods(webservice + "VerificarComprobante", jsonText, 0);

         }

         function VerifyAll() {
             var obj = {};
             obj["fecha"] = "2017-10-20";
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "VerificarComprobantes", jsonText, 2);


         }


         function Recalcular() {
             var obj = {};
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "RecalcularComprobantes", jsonText, 2);

         }

         function RunSrv() {
             var obj = {};
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "RunService", jsonText, 2);

         }

         function Resend() {
             var obj = {};
             obj["empresa"] = 16;
             obj["fecha"] = "2018-01-01";
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "Resend", jsonText, 2);

         }

          function SendPrueba() {
             var obj = {};
            obj["empresa"] = $("#txtcodemp").val();
            obj["numero"] = $("#txtnum").val();
            obj["est"] = $("#txtest").val();
            obj["pem"] = $("#txtpem").val();
            obj["dir"] = $("#txtdir").val();
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "SendPrueba", jsonText, 0);

         }


         function ImpMasivo() {
             var obj = {};
             obj["empresa"] = $("#txtcodemp").val();
             obj["desde"] = $("#txtdesde").val();
             obj["hasta"] = $("#txthasta").val();
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "ImpresionMasiva", jsonText, 0);

         }


         function ServerResult(data, retorno) {
             if (data != "") {
                 if (retorno == 0) {
                     alert(data.d);
                 }
                 if (retorno == 1) {
                     $("#Textarea1").val(data.d);
                 }
             }
         }

    </script>
