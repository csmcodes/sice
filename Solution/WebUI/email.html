<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <script src="scripts/jquery.js" type="text/javascript"></script>
    <script src="scripts/jquery-ui.js" type="text/javascript"></script>
    <script src="scripts/server.js" type="text/javascript"></script>
    <script type="text/javascript">
         $(document).ready(function () {
             $("#send").on("click", Send);
             
         });

         function Send() {

             var obj = {};
             obj["empresa"] = $("#empresa").val();
             obj["asunto"] = $("#asunto").val();
             var jsonText = JSON.stringify({ objeto: obj });
             CallServerMethods(webservice + "SendMail", jsonText, 0);

         }

         function ServerResult(data, retorno) {
             if (data != "") {
                 if (retorno == 0) {
                     $("#resultado").html(data.d);
                 }                 
             }
         }

    </script>
  
</head>

<body>
    <input type="text" id="empresa" placeholder="empresa" />
    <input type="text" id="asunto" placeholder="asunto"/>
           
    <input id="send" type="button" value="Send" /><br />
    <div id="resultado"></div>

</body>
</html>
